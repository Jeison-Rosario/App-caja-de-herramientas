name: tarea6
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0           # Consumo de APIs REST
  url_launcher: ^6.2.4   # Abrir links de universidades y noticias WP
  audioplayers: ^6.0.0   # Reproducir audio de los Pokémon (cries)
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/foto.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/

